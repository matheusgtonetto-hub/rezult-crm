[api]
enabled = true
port = 54321

[db]
port = 54322

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"

# O automation-runner se autentica sozinho (segredo/UUID nos próprios handlers),
# por isso o gateway NÃO deve exigir JWT — senão as chamadas internas (pg_cron
# "resume" e zapi-webhook "resume-reply"), que usam o segredo do motor, são
# barradas pelo gateway. Mantenha como false.
[functions.automation-runner]
verify_jwt = false

# A Z-API chama este webhook externamente, sem JWT — precisa ficar como false,
# senão o gateway barra as mensagens recebidas (texto/áudio/imagem/documento).
[functions.zapi-webhook]
verify_jwt = false

# A D-API chama este webhook externamente, sem JWT (mesmo motivo do zapi-webhook).
[functions.dapi-webhook]
verify_jwt = false

# O disparo-runner se autentica sozinho: pelo segredo do motor (chamadas do pg_cron)
# ou pelo JWT do usuário (chamada da UI ao iniciar). Gateway não deve exigir JWT.
[functions.disparo-runner]
verify_jwt = false

# O scheduled-followup-runner só é chamado pelo pg_cron (segredo do motor) —
# não tem modo UI. Gateway não deve exigir JWT.
[functions.scheduled-followup-runner]
verify_jwt = false

# A Meta chama este webhook externamente sem JWT (verificação por hub.verify_token).
[functions.meta-webhook]
verify_jwt = false

# O callback OAuth verifica o JWT internamente (usuário pode estar em redirect cross-origin).
[functions.meta-oauth-callback]
verify_jwt = false

# A Meta (Cloud API) chama este webhook externamente — verificação por hub.verify_token no GET.
[functions.cloud-api-webhook]
verify_jwt = false

# ─── Agente SDS ──────────────────────────────────────────────────────────────
# Todas as quatro funções abaixo são server-to-server: quem chama são os
# webhooks de WhatsApp e o pg_cron, que se autenticam por segredo próprio
# (x-internal-secret / automation_secret verificados dentro da própria
# função), nunca por JWT de usuário. Com verify_jwt = true o gateway barrava
# TODAS essas chamadas com 401 antes do código rodar -- o agente simplesmente
# não respondia. Mantenha como false.
[functions.agent-sds-qualify]
verify_jwt = false

[functions.agent-response-runner]
verify_jwt = false

[functions.agent-followup-runner]
verify_jwt = false

[functions.agent-business-hours-runner]
verify_jwt = false

# Chamada por DOIS caminhos: o app (JWT do usuário) e o agent-sds-qualify
# (server-to-server, só com x-internal-secret). A própria função aceita os
# dois e valida cada um -- ver isInternalCall em index.ts. Com verify_jwt =
# true o gateway barrava a chamada do agente antes da função rodar, e o
# agendamento de reunião falhava sempre com "erro de autorização", depois do
# agente já ter prometido o horário pro lead. Mantenha como false.
[functions.google-calendar-event]
verify_jwt = false

# Mesmo caso da google-calendar-event: app (JWT) e agente (x-internal-secret)
# chamam esta função, e ela valida os dois por conta própria.
[functions.google-calendar-delete]
verify_jwt = false
