<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!--
      Largura VIRTUAL de 1100px no celular, em vez de `width=device-width`.

      Navegador de desktop IGNORA esta meta por completo: ela só tem efeito em
      celular e tablet. Então trocá-la não muda nada no computador.

      Por que trocar: com `device-width` o iPhone se declara com 390px e o app
      tentava espremer nesses 390 um layout que precisa de mil e poucos -- as
      colunas se atropelavam e a tela ficava ilegível. Com 1100, o celular monta
      a página EXATAMENTE como o desktop e depois reduz tudo junto para caber na
      tela. Nada se sobrepõe, e quem quiser ler dá uma pinça (o zoom continua
      liberado, de propósito: sem ele isto viraria uma tela só de enfeite).

      O número: 1100 = os 1000px de piso do conteúdo (ver LARGURA_MINIMA_DO_APP
      em AppLayout.tsx) + os 55px da régua da barra lateral + folga. É o que
      garante que no celular nenhuma tela chegue a precisar de rolagem
      horizontal, porque o conteúdo já nasce acima do próprio piso.

      Quando o Multiatendimento ganhar layout de uma coluna para celular, esta
      meta precisa voltar a ser `device-width` NAQUELA rota -- senão o layout de
      celular nunca será acionado, já que a página continuará se achando com
      1100px de largura.
    -->
    <meta name="viewport" content="width=1100" />
    <title>Rezult CRM</title>
    <meta name="description" content="CRM simples para quem vende pelo WhatsApp" />
    <meta name="author" content="Rezult" />

    <!-- O ?v= sobe junto com a imagem. Favicon é dos recursos que o navegador
         guarda com mais teimosia: sem trocar a URL, quem já visitou continua
         vendo o ícone antigo por tempo indeterminado. Subiu para 4 em
         19/09/2026, com a marca oficial nova. -->
    <link rel="icon" type="image/png" href="/favicon.png?v=5" />
    <!-- O .ico não é declarado por acaso: o navegador pede /favicon.ico sozinho
         quando a aba abre, e sem esta linha ele usaria o arquivo velho em cache
         em vez do que o <link> acima aponta. Traz 16, 32 e 48px. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" sizes="16x16 32x32 48x48" />
    <!-- iOS, quando a pessoa põe o app na tela de início. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=5" />

    <!-- Meta Pixel -->
    <script>
      !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
      n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
      (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
      fbq('init','1696610304959752');
      fbq('track','PageView');
    </script>
    <!-- End Meta Pixel -->

<meta property="og:title" content="Rezult CRM" />
    <meta property="og:description" content="CRM simples para quem vende pelo WhatsApp" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://app.rezultcrm.com/og-rezult.png?v=5" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://app.rezultcrm.com/og-rezult.png?v=5" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
